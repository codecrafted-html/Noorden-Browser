name: Bouw en publiceer Noorder Browser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Bouw de native Noorder Browser en controleer de bundel
        env:
          SEARCH_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Noorder-macOS-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bouw Windows-installatie en ZIP
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Noorder-Windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Noorder-*
          path: release-assets
          merge-multiple: true
      - name: Controleer versienummer
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Git-tag $GITHUB_REF_NAME verschilt van app-versie $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publiceer alle downloads bij GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          cp build/icon.png release-assets/Noorder-logo.png
          cp src/logo.svg release-assets/Noorder-logo.svg
          assets=(release-assets/*.pkg release-assets/*.dmg release-assets/*.exe release-assets/*.zip release-assets/*.yml release-assets/*.blockmap release-assets/*.png release-assets/*.svg)
          for arch in arm64 x86_64; do
            for ext in dmg pkg zip; do test -s "release-assets/Noorder-Browser-${RELEASE_TAG#v}-macOS-$arch.$ext"; done
          done
          test -s release-assets/latest.yml
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Noorder Browser ${RELEASE_TAG#v}" --notes-file RELEASE.md "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false --latest
