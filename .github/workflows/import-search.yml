name: Import Search 1.0.17
on:
  push:
    branches: [integrate/search-1.0.17]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the pinned upstream Git tree
        run: |
          set -euo pipefail
          test ! -e macos
          git fetch --no-tags https://github.com/driceroland/Search.git 0db020253422154dad4b11d603a7d426d8ad2271
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = 5b6d01702394ea2c7752f6d3a05770e6bfdf7bd9
          git read-tree --prefix=macos/ -u FETCH_HEAD
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor all 759 tracked Search files under macos'
          test "$(git rev-parse HEAD:macos)" = 5b6d01702394ea2c7752f6d3a05770e6bfdf7bd9
          git push origin HEAD:refs/heads/integrate/search-1.0.17
